[project]
name = "parley"
version = "0.1.0"
description = "Push-to-talk voice assistant that runs entirely on your own machine: local speech-to-text, local LLM, local text-to-speech."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4.7",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "pynput>=1.7",
    # One CUDA 12 stack from pip, shared by faster-whisper and Kokoro, so users never install the CUDA toolkit
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cufft-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
    # GPU build of ONNX Runtime for Kokoro; falls back to CPU without an NVIDIA GPU.
    # 1.25+ is built for CUDA 13, whose cuDNN wheel would clash with CTranslate2's CUDA 12 one.
    "onnxruntime-gpu>=1.22,<1.25; sys_platform == 'win32' or sys_platform == 'linux'",
    "anthropic>=0.70",
]

[tool.uv]
# kokoro-onnx depends on the CPU-only onnxruntime, which would clash with onnxruntime-gpu
override-dependencies = ["onnxruntime; sys_platform == 'darwin'"]

[project.scripts]
parley = "parley.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]
