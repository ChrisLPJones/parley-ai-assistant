# Parley settings. Copy to %LOCALAPPDATA%\parley\config.toml (or $PARLEY_HOME/config.toml). Every key is optional.
# Most keys apply as soon as you save them in Settings. These need a restart of Parley (Settings offers Restart now):
# stt.model, stt.device, stt.compute_type, stt.cpu_threads, tts.device, tts.model, gpu.download_cuda.

[hotkey]
# Hold to talk. pynput key names: pause, f13, scroll_lock, ctrl_r, insert, or a single character
key = "pause"

[audio]
# input_device = "Microphone"   # name substring or index from `parley --list-devices`
# output_device = "Speakers"
preroll_ms = 300
sounds = true

[stt]
model = "auto"             # auto = large-v3-turbo on NVIDIA GPUs, small.en on CPU; or tiny.en / base.en / small.en / small / medium / large-v3-turbo (downloaded and checked by Parley)
device = "auto"            # auto | cuda | cpu
cpu_threads = 0            # CPU only: threads for Whisper; 0 = auto (about half the logical cores, max 8)
compute_type = "default"
language = "en"            # "" to auto-detect
beam_size = 1

[llm]
# builtin   - Parley downloads and runs a small local model itself (default; private and offline)
# anthropic - Claude via the Anthropic API: save the key on Settings > LLM or with parley --set-key anthropic (or set ANTHROPIC_API_KEY)
# openai    - OpenAI API: save the key on Settings > LLM or with parley --set-key openai (or set OPENAI_API_KEY)
# ollama / server - a local server you already run (Ollama / any OpenAI-compatible server)
backend = "builtin"

# builtin
preset = "auto"            # auto picks from your hardware: small (Qwen3.5 4B) with a GPU, tiny (Qwen3.5 2B) otherwise; medium (Qwen3.5 9B) is never picked automatically
# model_repo = "unsloth/Qwen3.5-9B-GGUF"   # any GGUF on Hugging Face instead of a preset
# model_file = "Qwen3.5-9B-Q4_K_M.gguf"
# model_path = "D:/models/my-model.gguf"    # or a GGUF already on disk
runtime = "auto"           # auto = CUDA on NVIDIA, Vulkan on a discrete AMD/Intel GPU, else CPU; or force cuda | vulkan | cpu (Intel GPUs: unverified)
gpu_layers = -1            # -1 = fit to free GPU memory automatically; 0 = CPU only
num_ctx = 8192
temperature = 0.7          # local backends only
think = false              # reasoning models think before answering: smarter, much slower to start talking

# anthropic / openai
# model = ""               # "" = claude-opus-5-5 for anthropic, chat-latest for openai
# api_key = ""             # legacy: a key here is moved into the Windows credential store at startup and removed from this file.
#                          # Save one with "parley --set-key anthropic|openai", or use the ANTHROPIC_API_KEY / OPENAI_API_KEY environment variable
effort = "low"             # anthropic: low | medium | high (low answers fastest)

# ollama / server
# base_url = "http://127.0.0.1:11434"   # server: e.g. http://127.0.0.1:1234/v1 for LM Studio
# keep_alive = "30m"                    # ollama only

history_turns = 10
reset_after_idle_s = 300
# system_prompt = "You are Parley, ..."

[tools]
enabled = true      # let the LLM look at files/folders and open apps, files, folders and websites
web_search = true   # and search the web (DuckDuckGo locally; Claude uses Anthropic's web search)

[tts]
voice = "af_heart"   # see https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md
speed = 1.1
lang = "en-us"
device = "auto"     # auto (CUDA on NVIDIA, else CPU) | cuda | cpu
model = "default"   # default | fp16 | int8 (Kokoro file: smaller and quicker, but the sound of fp16/int8 is not checked yet)

[gpu]
download_cuda = true  # installed (packaged) copies only: on an NVIDIA GPU, download the CUDA libraries once (about 1.6 GB) and restart Parley once when idle to use them (tray app); the CPU is used meanwhile. Not needed when stt.device and tts.device are "cpu"

[updates]
check = true        # installed copies only: look for a newer Parley after startup and ask before installing (source checkouts never update)
