# Parley settings. Copy to %LOCALAPPDATA%\parley\config.toml (or $PARLEY_HOME/config.toml). Every key is optional.

[hotkey]
# Hold to talk. pynput key names: pause, f13, scroll_lock, ctrl_r, insert, or a single character
key = "pause"

[audio]
# input_device = "Microphone"   # name substring or index from `parley --list-devices`
# output_device = "Speakers"
preroll_ms = 300
sounds = true

[stt]
model = "large-v3-turbo"   # tiny / base / small / medium / large-v3 / large-v3-turbo / distil-large-v3
device = "auto"            # auto | cuda | cpu
compute_type = "default"
language = "en"            # "" to auto-detect
beam_size = 1

[llm]
# builtin: Parley downloads and runs llama.cpp and a model itself (nothing else to install).
# ollama / openai: use a server you already run instead.
backend = "builtin"
preset = "auto"            # auto picks by VRAM: xl (Qwen3.6 35B-A3B), large (Gemma 4 26B-A4B),
                           # medium (Qwen3.5 9B), small (Qwen3.5 4B), tiny (Qwen3.5 2B)
# model_repo = "unsloth/gemma-4-12b-it-GGUF"   # any GGUF on Hugging Face instead of a preset
# model_file = "gemma-4-12b-it-Q4_K_M.gguf"
# model_path = "D:/models/my-model.gguf"       # or a GGUF already on disk
gpu_layers = 999
num_ctx = 8192
temperature = 0.7
think = false              # reasoning models think before answering: smarter, much slower to start talking
history_turns = 10
reset_after_idle_s = 300
# system_prompt = "You are Parley, ..."

# For backend = "ollama" or "openai":
# base_url = "http://127.0.0.1:11434"   # openai-style servers include /v1, e.g. http://127.0.0.1:1234/v1
# model = ""                            # "" = first model the server reports
# keep_alive = "30m"                    # ollama only

[tts]
voice = "af_heart"   # see https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md
speed = 1.1
lang = "en-us"
device = "auto"     # auto | cpu
