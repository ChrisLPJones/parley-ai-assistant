# Parley settings. Copy to %LOCALAPPDATA%\parley\config.toml (or $PARLEY_HOME/config.toml). Every key is optional.

[hotkey]
# Hold to talk. pynput key names: pause, f13, scroll_lock, ctrl_r, insert, or a single character
key = "pause"

[audio]
# input_device = "Microphone"   # name substring or index from `parley --list-devices`
# output_device = "Speakers"
preroll_ms = 300
sounds = true

[stt]
model = "auto"             # auto = large-v3-turbo on NVIDIA GPUs, small.en on CPU; or tiny / base / small / medium / large-v3-turbo
device = "auto"            # auto | cuda | cpu
compute_type = "default"
language = "en"            # "" to auto-detect
beam_size = 1

[llm]
# builtin   - Parley downloads and runs a small local model itself (default; private and offline)
# anthropic - Claude via the Anthropic API: set ANTHROPIC_API_KEY (or api_key below)
# openai    - OpenAI API: set OPENAI_API_KEY (or api_key below)
# ollama / server - a local server you already run (Ollama / any OpenAI-compatible server)
backend = "builtin"

# builtin
preset = "auto"            # auto picks from your hardware: small (Qwen3.5 4B) with a GPU, tiny (Qwen3.5 2B) otherwise
# model_repo = "unsloth/Qwen3.5-9B-GGUF"   # any GGUF on Hugging Face instead of a preset
# model_file = "Qwen3.5-9B-Q4_K_M.gguf"
# model_path = "D:/models/my-model.gguf"    # or a GGUF already on disk
gpu_layers = -1            # -1 = fit to free GPU memory automatically; 0 = CPU only
num_ctx = 8192
temperature = 0.7          # local backends only
think = false              # reasoning models think before answering: smarter, much slower to start talking

# anthropic / openai
# model = ""               # "" = claude-opus-5-5 for anthropic, chat-latest for openai
# api_key = ""             # prefer the ANTHROPIC_API_KEY / OPENAI_API_KEY environment variables
effort = "low"             # anthropic: low | medium | high (low answers fastest)

# ollama / server
# base_url = "http://127.0.0.1:11434"   # server: e.g. http://127.0.0.1:1234/v1 for LM Studio
# keep_alive = "30m"                    # ollama only

history_turns = 10
reset_after_idle_s = 300
# system_prompt = "You are Parley, ..."

[tools]
enabled = true      # let the LLM look at files/folders and open apps, files, folders and websites
web_search = true   # and search the web (DuckDuckGo locally; Claude uses Anthropic's web search)

[tts]
voice = "af_heart"   # see https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md
speed = 1.1
lang = "en-us"
device = "auto"     # auto | cpu
